<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://unpkg.com data:; connect-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Sesiones | CerperStats</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/sessions_panel.css" />
</head>

<body>
  <main class="panel-container" role="main">
    <!-- Page layout: lab sidebar + main content -->
    <div class="page-layout">
      <!-- Lab Sidebar - Left side navigation spanning full height -->
      <aside class="lab-sidebar" id="lab-sidebar" aria-label="Filtro de laboratorios">
        <div class="lab-sidebar-header">
          <span class="lab-sidebar-title">Labs</span>
        </div>
        <div class="lab-sidebar-track" id="lab-sidebar-track">
          <!-- Markers will be injected by JS -->
        </div>
      </aside>

      <!-- Main content column -->
      <div class="main-content">
        <!-- Unified Glass Card: Header + Filters + Legend -->
        <section class="panel-glass-card" aria-label="Panel de control">
          <!-- Header Row -->
          <header class="panel-header">
            <button id="btn-volver" class="btn-return" aria-label="Volver">
              <i data-lucide="chevron-left"></i>
            </button>
            <div class="panel-brand">
              <img src="assets/logos/cerper_sessions.png" alt="Cerper" class="panel-logo" />
              <h1 id="panel-title" class="panel-title">Expedientes</h1>
            </div>
          </header>

          <!-- Filters Section - 3 Glass Zones -->
          <div class="filters-section" id="filters-bar" aria-label="Filtros de sesiones">
            <!-- Hidden selects for filter state -->
            <select id="filter-lab" class="filter-select hidden"></select>
            <select id="filter-proc" class="filter-select hidden">
              <option value="all">Todos</option>
              <option value="autorizaciones">Autorizaciones</option>
              <option value="implementaciones">Implementaciones</option>
              <option value="intralaboratorios">Intralaboratorios</option>
              <option value="intercomparación">Intercomparación</option>
            </select>
            <select id="filter-analisis" class="filter-select hidden">
              <option value="all">Todas</option>
              <option value="mono">Monoanalito</option>
              <option value="multi">Multianalito</option>
            </select>

            <div class="filters-grid">
              <!-- Zone 1: Procedimiento - 3x2 Grid -->
              <div class="filter-zone filter-zone-proc">
                <label class="filter-zone-label">Procedimiento</label>
                <div class="proc-grid" id="filter-proc-group">
                  <button type="button" class="proc-grid-item active" data-value="all">Todos</button>
                  <button type="button" class="proc-grid-item" data-value="intralaboratorios">Intralaboratorio</button>
                  <button type="button" class="proc-grid-item" data-value="implementaciones">Implementación</button>
                  <button type="button" class="proc-grid-item" data-value="autorizaciones">Autorización</button>
                  <button type="button" class="proc-grid-item" data-value="intercomparación">Intercomparación</button>
                </div>
              </div>

              <!-- Zone 2: Estructura - 2 options -->
              <div class="filter-zone filter-zone-estructura">
                <label class="filter-zone-label">Estructura</label>
                <div class="estructura-options" id="filter-analisis-group">
                  <button type="button" class="estructura-btn active" data-value="all">Todas</button>
                  <button type="button" class="estructura-btn" data-value="mono">Monoanalito</button>
                  <button type="button" class="estructura-btn" data-value="multi">Multianalito</button>
                </div>
              </div>

              <!-- Zone 3: Fecha - Simple range inputs -->
              <div class="filter-zone filter-zone-fecha">
                <label class="filter-zone-label">Rango de Fechas</label>
                <div class="fecha-range">
                  <div class="fecha-input-wrap">
                    <span class="fecha-label">Desde</span>
                    <input type="date" id="filter-date-from" class="fecha-input" />
                  </div>
                  <div class="fecha-input-wrap">
                    <span class="fecha-label">Hasta</span>
                    <input type="date" id="filter-date-to" class="fecha-input" />
                  </div>
                  <button type="button" class="fecha-clear-btn" id="fecha-clear-btn" title="Limpiar fechas">
                    <i data-lucide="x"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Status Legend -->
          <div class="status-legend" aria-label="Leyenda de estados">
            <div class="legend-item"><span class="legend-dot status-light-active"></span><span>Activa</span></div>
            <div class="legend-item"><span class="legend-dot status-light-sufficient"></span><span>Suficiente</span>
            </div>
            <div class="legend-item"><span class="legend-dot status-light-finalized"></span><span>Finalizada</span>
            </div>
            <div class="legend-item"><span class="legend-dot status-light-cancelled"></span><span>Cancelada</span></div>
          </div>
        </section>

        <section id="sessions-container" class="sessions-grid" aria-live="polite">
          <p class="loading">Cargando sesiones...</p>
        </section>
      </div>
    </div>
  </main>

  <script src="js/auth_guard.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { try { lucide.createIcons(); } catch (e) { } });</script>
  <script src="js/notify.js"></script>
  <script src="js/sessions_panel.js"></script>
</body>

</html>
