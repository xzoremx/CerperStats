<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerperStats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.15));
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
    <div class="glass-card rounded-3xl p-12 max-w-md w-full mx-4 text-center">
        <!-- Logo -->
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white/10 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">CerperStats</h1>
            <p class="text-white/60">Sistema de Evaluacion Estadistica</p>
        </div>

        <!-- Actions -->
        <div class="space-y-4">
            <a href="/register.html" class="btn-primary block w-full py-4 rounded-xl text-white font-semibold">
                Crear una cuenta
            </a>
            <p class="text-white/50 text-sm">
                Para iniciar sesion, usa la aplicacion de escritorio CerperStats
            </p>
        </div>

        <!-- Links -->
        <div class="mt-8 pt-6 border-t border-white/10">
            <div class="flex justify-center gap-6 text-sm text-white/40">
                <a href="/admin-panel/" class="hover:text-white/70 transition-colors">Panel Admin</a>
                <span>|</span>
                <a href="/health" class="hover:text-white/70 transition-colors">Estado del Sistema</a>
            </div>
        </div>
    </div>
</body>
</html>
