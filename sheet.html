<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CerperStats - Ingreso de Datos</title>

  <!-- Enlace al CSS -->
  <link rel="stylesheet" href="css/sheet.css">
</head>
<body>

  <div id="config-container">
    <h2>Seleccione el tipo de ingreso de datos</h2>
    <button id="mono-btn" class="select-btn">Un solo analito</button>
    <button id="multi-btn" class="select-btn">Varios analitos</button>
  </div>

  <div id="data-entry">
    <h3 id="mode-title"></h3>
    <p>Pega tus datos desde Excel o escríbelos manualmente:</p>

    <div class="excel-container">
      <table id="excel" class="excel"><tbody></tbody></table>
    </div>

    <div class="actions">
      <button id="validate-btn">Validar</button>
      <button id="send-btn" disabled>Enviar</button>
    </div>
    <div id="feedback"></div>
  </div>

  <!-- Enlace al JS -->
  <script src="js/sheet.js"></script>
</body>
</html>
