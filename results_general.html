<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <title>CerperStats – Resultados</title>
</head>

<body>
  <script>
    (function () {
      const target = 'evaluation_results.html';
      try {
        sessionStorage.setItem('evalResultsView', 'visualizaciones');
        const fromSessionDetail = sessionStorage.getItem('sessionSeleccionada');
        if (fromSessionDetail) sessionStorage.setItem('evalResultsSessionId', fromSessionDetail);
        if (fromSessionDetail && !sessionStorage.getItem('sessionID')) {
          sessionStorage.setItem('sessionID', fromSessionDetail);
        }
      } catch (_) {}
      if (window.cerper && typeof window.cerper.openPage === 'function') {
        window.cerper.openPage(target);
      } else {
        window.location.href = target;
      }
    })();
  </script>
</body>

</html>
