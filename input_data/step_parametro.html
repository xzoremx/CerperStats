<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingreso de Datos - Parámetro</title>
  <link rel="stylesheet" href="../css/input_data.css" />
</head>

<body>
  <header class="header">
    <img src="../assets/logos/cerper_logo.png" alt="CERPER" class="logo" />
    <h1 id="lab-title">Selección de Parámetro</h1>
    <p class="subtitle">Seleccione el parámetro que representa las repeticiones o agrupaciones</p>
  </header>

  <main class="container">
    <section class="options">
      <button class="select-btn" data-param="Días">
        <i data-lucide="calendar"></i> Días
      </button>
      <button class="select-btn" data-param="Analistas">
        <i data-lucide="user"></i> Analistas
      </button>
      <button class="select-btn" data-param="Equipos">
        <i data-lucide="cpu"></i> Equipos
      </button>
      <button class="select-btn" data-param="Otros">
        <i data-lucide="list"></i> Otros
      </button>
    </section>

    <div class="actions">
      <button id="go-back" class="btn-back">
        <i data-lucide="arrow-left"></i> Volver
      </button>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/input_data/step_parametro.js" type="module"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
  
</body>
</html>
