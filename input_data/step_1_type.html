<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://unpkg.com data:; connect-src 'self';" />
  <title>Ingreso de Datos - Tipo de Análisis</title>
  <link rel="stylesheet" href="../css/input_data.css" />
</head>

<body>
  <header class="header">
    <img src="../assets/logos/cerper_logo.png" alt="CERPER" class="logo" />
    <!-- El título ahora se completa dinámicamente -->
    <h1 id="lab-title">Modo de estructura de datos</h1>
    <p class="subtitle">Seleccione el tipo de estructura de datos</p>
  </header>

  <main class="container">
    <section class="options">
      <button id="mono-btn" class="select-btn" data-mode="mono">
        <i data-lucide="flask-round"></i> Monoanalito
      </button>
      <button id="multi-btn" class="select-btn" data-mode="multi">
        <i data-lucide="layers"></i> Multianalito
      </button>
    </section>
  </main>

  <div class="actions">
    <button id="go-menu" class="btn-back">
      <i data-lucide="arrow-left"></i> Volver
    </button>
  </div>

  <script src="../js/auth_guard.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/input_data/step_1_type.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Recuperar los datos del laboratorio y procedimiento
      const labKey = sessionStorage.getItem("labSeleccionado") || localStorage.getItem("labSeleccionado");
      const labName = sessionStorage.getItem("labNombreVisible") || labKey;
      const proc = sessionStorage.getItem("procedimientoSeleccionado") || localStorage.getItem("procedimientoSeleccionado");

      // Actualizar el título
      const labTitle = document.getElementById("lab-title");
      if (labTitle) {
        labTitle.textContent = `${labName} - ${proc}`;
      }
    });
  </script>
</body>
</html>
