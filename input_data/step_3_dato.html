<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingreso de Datos - Tipo de Dato</title>
  <link rel="stylesheet" href="../css/input_data.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #001f2e, #000);
      color: #00ffff;
      font-family: 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    header {
      margin-bottom: 40px;
    }

    .logo {
      width: 120px;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.9rem;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff80;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: #a0faff;
      opacity: 0.9;
    }

    .container {
      background: rgba(0, 255, 255, 0.05);
      border: 1.5px solid rgba(0, 255, 255, 0.25);
      border-radius: 16px;
      padding: 30px 50px;
      width: 380px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      animation: fadeIn 0.6s ease-in-out;
    }

    .container h3 {
      color: #00ffff;
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-shadow: 0 0 6px #00ffff88;
    }

    .select-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: 1.5px solid #00ffff;
      background: rgba(0, 255, 255, 0.08);
      color: #00ffff;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: capitalize;
    }

    .select-btn:hover {
      background: rgba(0, 255, 255, 0.25);
      box-shadow: 0 0 10px #00ffff55;
      transform: translateY(-2px) scale(1.02);
    }

    footer.actions {
      margin-top: 40px;
    }

    .btn-back {
      border: 1.5px solid #00ffff;
      background: transparent;
      color: #00ffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      background: rgba(0, 255, 255, 0.15);
      box-shadow: 0 0 8px #00ffff77;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <header>
    <img src="../assets/logos/cerper_logo.png" alt="CERPER" class="logo" />
    <h1 id="lab-title">Tipo de Dato</h1>
    <p class="subtitle">Seleccione el tipo de análisis correspondiente al laboratorio</p>
  </header>

  <main class="container" id="main-container">
    <!-- Contenido generado dinámicamente -->
  </main>

  <footer class="actions">
    <button id="go-back" class="btn-back">
      <i data-lucide="arrow-left"></i> Volver
    </button>
  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../js/input_data/step_3_dato.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</body>
</html>
