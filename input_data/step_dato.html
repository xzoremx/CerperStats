<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingreso de Datos - Tipo de Dato</title>
  <link rel="stylesheet" href="../css/input_data.css" />
</head>

<body>
  <header class="header">
    <img src="../assets/logos/cerper_logo.png" alt="CERPER" class="logo" />
    <h1 id="lab-title">Tipo de Dato</h1>
    <p class="subtitle">Seleccione el tipo de dato para este laboratorio</p>
  </header>

  <main class="container" id="main-container">
    <section class="options">
      <button id="btn-cuantitativo" class="select-btn" data-type="cuantitativo">
        <i data-lucide="calculator"></i> Cuantitativo
      </button>
      <button id="btn-cualitativo" class="select-btn" data-type="cualitativo">
        <i data-lucide="list-checks"></i> Cualitativo
      </button>
    </section>

    <div class="actions">
      <button id="go-back" class="btn-back">
        <i data-lucide="arrow-left"></i> Volver
      </button>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../js/input_data/step_dato.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</body>
</html>
