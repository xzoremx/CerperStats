<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingreso de Datos - Parámetro</title>
  <link rel="stylesheet" href="../css/input_data.css" />
</head>

<body>
  <header class="header">
    <img src="../assets/logos/cerper_logo.png" alt="CERPER" class="logo" />
    <h1 id="lab-title">Selección de Parámetro</h1>
    <p class="subtitle">Seleccione lo que representa las repeticiones o agrupaciones</p>
  </header>

  <main class="container">
    <!-- Opciones dinámicas -->
    <section class="options" id="param-options"></section>

    <!-- Campo personalizado -->
    <div id="custom-param" class="form-block custom-param-block" style="display:none; margin-top: 1.5rem;">
      <p class="custom-label">Definir otro parámetro:</p>

      <div class="custom-row">
        <input
          type="text"
          id="input-param"
          placeholder="Turno, Ensayo..."
          class="custom-input"
        />
        <button id="confirm-param" class="select-btn small-btn">Confirmar</button>
      </div>
    </div>


    <div class="actions">
      <button id="go-back" class="btn-back">
        <i data-lucide="arrow-left"></i> Volver
      </button>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/input_data/step_2_parametro.js" type="module"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
</body>
</html>
