<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self';">
    <title>CerperStats – Reportes Generados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif
        }

        .glass-container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.02) 100%);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.05) inset, 0 20px 60px -10px rgba(0, 0, 0, 0.6);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            transition: all 0.25s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-download {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .report-card {
            cursor: pointer;
        }

        .report-card.downloading {
            opacity: 0.7;
            pointer-events: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        @keyframes download-pulse {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(3px);
            }
        }

        .downloading .download-icon {
            animation: download-pulse 0.6s ease-in-out infinite;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-gray-900 via-slate-900 to-gray-800 text-white relative overflow-x-hidden">
    <!-- Video Background -->
    <div class="fixed inset-0 -z-20">
        <div class="w-full h-full">
            <video autoplay loop muted playsinline class="w-full h-full object-cover">
                <source src="assets/videos/report_browser.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex px-4 sm:px-6 pb-16 pt-8 items-start justify-center relative">
        <div
            class="relative w-full max-w-5xl mt-6 glass-container rounded-3xl flex flex-col overflow-hidden shadow-2xl">

            <!-- Header -->
            <div class="p-8 border-b border-white/10">
                <div class="flex items-center justify-between mb-4">
                    <button id="btn-back"
                        class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2 text-gray-300 hover:text-white">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        Volver
                    </button>
                    <button id="btn-new-report"
                        class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2 text-white">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Nuevo Reporte
                    </button>
                </div>
                <div class="flex items-center gap-4">
                    <div
                        class="w-14 h-14 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
                        <i data-lucide="folder-open" class="w-7 h-7 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white">Reportes Generados</h1>
                        <p id="session-subtitle" class="text-gray-400 mt-1">Sesión #...</p>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="px-8 py-4 bg-black/20 border-b border-white/5 flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i>
                    <span id="stats-count" class="text-gray-300">0 reportes</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="hard-drive" class="w-4 h-4 text-cyan-400"></i>
                    <span id="stats-size" class="text-gray-300">0 KB total</span>
                </div>
            </div>

            <!-- Content -->
            <div class="p-8">
                <!-- Reports Grid -->
                <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Reports will be inserted here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden empty-state glass-card rounded-xl">
                    <div
                        class="w-20 h-20 rounded-full bg-gradient-to-br from-gray-700 to-gray-800 flex items-center justify-center mb-4">
                        <i data-lucide="file-x" class="w-10 h-10 text-gray-500"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-white mb-2">No hay reportes</h3>
                    <p class="text-gray-400 mb-6">Genera nuevos reportes desde la página de configuración</p>
                    <button id="btn-generate-first"
                        class="btn-primary px-6 py-3 rounded-xl font-semibold text-white flex items-center gap-2">
                        <i data-lucide="file-plus" class="w-5 h-5"></i>
                        Generar Primer Reporte
                    </button>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="hidden empty-state">
                    <i data-lucide="loader-2" class="w-12 h-12 text-indigo-400 animate-spin mb-4"></i>
                    <p class="text-gray-400">Cargando reportes...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth_guard.js"></script>
    <script src="js/security/icon_safety.js"></script>
    <script src="js/reports_browser.js" defer></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
