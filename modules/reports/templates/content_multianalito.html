<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido - Informe Estadístico (Multianalito)</title>
    <link rel="stylesheet" href="content_multianalito.css">
    <script>
        // Content renderer - Multianalito only
        window.renderReport = function (data) {
            document.body.innerHTML = ''; // Clear loading state

            // Inject dynamic CSS for badge styles (from value_mappings)
            if (data.dynamic_css) {
                const styleEl = document.createElement('style');
                styleEl.type = 'text/css';
                styleEl.textContent = data.dynamic_css;
                document.head.appendChild(styleEl);
            }

            // Update document title if available
            if (data.cover && data.cover.title) {
                document.title = data.cover.title;
            }

            // Render Sections
            if (data.sections && data.sections.length > 0) {
                const container = document.createElement('div');
                container.className = 'content-container';
                document.body.appendChild(container);

                data.sections.forEach(section => {
                    renderCategorySection(section, container);
                });
            }
        };

        function renderCategorySection(section, container) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'category-section';

            section.tests.forEach((test, testIndex) => {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-section';

                test.niveles.forEach((nivel, nivelIndex) => {
                    if (nivelIndex === 0) {
                        // ========================================
                        // PRIMER NIVEL: Amarrado con header + título + descripción
                        // Todo dentro de un solo contenedor con page-break-inside: avoid
                        // ========================================
                        const introBlock = document.createElement('div');
                        introBlock.className = 'test-intro-block';

                        let introHTML = '';

                        // Header solo en el primer test de la categoría
                        if (testIndex === 0) {
                            introHTML += `<h2 class="category-header">${section.header}</h2>`;
                        }

                        // Título y descripción del test
                        introHTML += `
                            <h3 class="test-title">${test.name}</h3>
                            ${test.description ? `<div class="test-description">${test.description}</div>` : ''}
                        `;

                        // Nivel 1 content
                        introHTML += '<div class="nivel-content">';
                        if (nivel.nivel) {
                            introHTML += `<div class="nivel-title">Nivel ${nivel.nivel}</div>`;
                        }
                        if (nivel.table && nivel.table.rows && nivel.table.rows.length > 0) {
                            introHTML += renderTable(nivel.table);
                        }
                        if (nivel.conclusion) {
                            introHTML += `
                                <div class="conclusion-box status-${nivel.conclusion.status}">
                                    <span class="conclusion-label">Conclusión:</span>
                                    <span class="conclusion-text">${nivel.conclusion.text}</span>
                                </div>
                            `;
                        }
                        if (nivel.graphs && nivel.graphs.length > 0) {
                            nivel.graphs.forEach(g => {
                                introHTML += `
                                    <div class="graph-container">
                                        ${g.label ? `<div style="font-weight:bold;margin-bottom:4px;">${g.label}</div>` : ''}
                                        <img src="${g.data}" class="graph-img">
                                    </div>
                                `;
                            });
                        }
                        introHTML += '</div>';

                        introBlock.innerHTML = introHTML;
                        testDiv.appendChild(introBlock);

                    } else {
                        // ========================================
                        // NIVELES 2, 3, etc.: Cada uno en su propia página
                        // ========================================
                        const nivelDiv = document.createElement('div');
                        nivelDiv.className = 'nivel-block';

                        let nivelHTML = '';
                        if (nivel.nivel) {
                            nivelHTML += `<div class="nivel-title">Nivel ${nivel.nivel}</div>`;
                        }
                        if (nivel.table && nivel.table.rows && nivel.table.rows.length > 0) {
                            nivelHTML += renderTable(nivel.table);
                        }
                        if (nivel.conclusion) {
                            nivelHTML += `
                                <div class="conclusion-box status-${nivel.conclusion.status}">
                                    <span class="conclusion-label">Conclusión:</span>
                                    <span class="conclusion-text">${nivel.conclusion.text}</span>
                                </div>
                            `;
                        }
                        if (nivel.graphs && nivel.graphs.length > 0) {
                            nivel.graphs.forEach(g => {
                                nivelHTML += `
                                    <div class="graph-container">
                                        ${g.label ? `<div style="font-weight:bold;margin-bottom:4px;">${g.label}</div>` : ''}
                                        <img src="${g.data}" class="graph-img">
                                    </div>
                                `;
                            });
                        }

                        nivelDiv.innerHTML = nivelHTML;
                        testDiv.appendChild(nivelDiv);
                    }
                });

                sectionDiv.appendChild(testDiv);
            });

            container.appendChild(sectionDiv);
        }

        function renderTable(tableData) {
            if (!tableData.rows || tableData.rows.length === 0) return '';

            const cols = tableData.columns || Object.keys(tableData.rows[0]);
            const MAX_ROWS_PER_PAGE = 30;
            
            // For multianalito: split large tables into chunks
            if (tableData.rows.length > MAX_ROWS_PER_PAGE) {
                const chunks = [];
                for (let i = 0; i < tableData.rows.length; i += MAX_ROWS_PER_PAGE) {
                    chunks.push(tableData.rows.slice(i, i + MAX_ROWS_PER_PAGE));
                }
                
                let html = '';
                chunks.forEach((chunk, chunkIndex) => {
                    const isLastChunk = chunkIndex === chunks.length - 1;
                    html += `
                        <div class="table-chunk">
                            <table class="table-multianalito">
                                <thead>
                                    <tr>
                                        ${cols.map(c => `<th>${c.label || c.key || c}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${chunk.map(row => `
                                        <tr>
                                            ${cols.map(c => {
                                                const key = c.key || c;
                                                return `<td>${row[key] !== undefined ? row[key] : '-'}</td>`;
                                            }).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            ${!isLastChunk ? '<div class="table-continuation">(Continúa en la siguiente página)</div>' : ''}
                        </div>
                    `;
                });
                
                return html;
            }
            
            // Small tables: render as single table
            return `
                <table class="table-multianalito">
                    <thead>
                        <tr>
                            ${cols.map(c => `<th>${c.label || c.key || c}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${tableData.rows.map(row => `
                            <tr>
                                ${cols.map(c => {
                                    const key = c.key || c;
                                    return `<td>${row[key] !== undefined ? row[key] : '-'}</td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
    </script>
</head>

<body>
    <div style="text-align:center; padding: 2rem; color: #666;">
        Generando contenido...
    </div>
</body>

</html>
