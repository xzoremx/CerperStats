<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; }
    #vanta-canvas { overflow: hidden; }
    .card-container {
      position: relative;
      z-index: 0;
    }
    .card-container::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(to bottom right, #525252, transparent, #262626);
      border-radius: 0.75rem;
      z-index: -1;
    }
    .card-content {
      border-radius: 0.75rem;
      overflow: hidden;
      background: #171717;
    }
    .divider-gradient {
      height: 1px;
      background: linear-gradient(to right, transparent, #525252, transparent);
    }
  </style>
</head>
<body class="bg-neutral-950 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full card-container">
    <div class="card-content shadow-lg backdrop-blur-sm">
      <div class="h-[150px] relative" id="vanta-canvas">
        <div class="absolute top-4 left-4 z-10">
          <span class="px-2 py-1 bg-neutral-800/80 rounded-full text-xs text-neutral-400 mb-2 inline-block">SECURE ACCESS</span>
          <h2 class="text-2xl font-bold text-white">Login Portal</h2>
          <div class="h-1 w-12 bg-neutral-400 mt-2 rounded-full"></div>
        </div>
      </div>
      
      <div class="p-6 flex flex-col bg-neutral-900">
        <div>
          <span class="px-2 py-1 bg-neutral-800 rounded-full text-xs text-neutral-400 mb-2 inline-block">AUTHENTICATION</span>
          <h3 class="text-xl font-semibold text-neutral-200 mb-4">Account Login</h3>
          
          <form class="space-y-4 mb-6">
            <div>
              <label for="email" class="text-neutral-300 text-xs font-medium block mb-1">EMAIL</label>
              <input type="email" id="email" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2 text-neutral-200 focus:outline-none focus:ring-2 focus:ring-neutral-600 text-sm" placeholder="your@email.com" required="">
            </div>
            
            <div>
              <div class="flex justify-between items-center mb-1">
                <label for="password" class="text-neutral-300 text-xs font-medium">PASSWORD</label>
                <a href="#" class="text-neutral-400 text-xs hover:text-neutral-300">Forgot?</a>
              </div>
              <input type="password" id="password" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-2 text-neutral-200 focus:outline-none focus:ring-2 focus:ring-neutral-600 text-sm" placeholder="••••••••" required="">
            </div>
            
            <div class="flex items-center">
              <input type="checkbox" id="remember" class="w-4 h-4 bg-neutral-800 border-neutral-700 rounded mr-2">
              <label for="remember" class="text-neutral-400 text-xs">Remember this device</label>
            </div>
          </form>
          
          <div class="flex justify-between text-sm space-x-3">
            <button type="submit" class="flex-1 px-4 py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 rounded-lg transition flex items-center justify-center font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
              </svg>
              Login
            </button>
            <button class="flex-1 px-4 py-2.5 bg-black hover:bg-neutral-800 text-neutral-300 rounded-lg transition flex items-center justify-center font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              SSO
            </button>
          </div>
        </div>
        
        <div class="mt-6 pt-4 text-center">
          <div class="divider-gradient mb-4"></div>
          <p class="text-neutral-400 text-xs">Don't have an account? <a href="#" class="text-neutral-300 hover:underline">Request Access</a></p>
          <div class="flex items-center justify-center mt-4 space-x-2">
            <span class="w-2 h-2 rounded-full bg-green-500"></span>
            <span class="text-neutral-400 text-xs">System Status: Operational</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.NET({
        el: "#vanta-canvas",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 150,
        minWidth: 200,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0xd1d5db,
        backgroundColor: 0x171717,
        points: 8,
        maxDistance: 20.00,
        spacing: 18.00,
        showDots: true
      });
    });
  </script>


</body></html>
