<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://unpkg.com data:; connect-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inputs Monoanalito | CerperStats</title>
  <link rel="stylesheet" href="css/inputs_table.css" />
</head>
<body>
  <main class="sheet-container" role="main">
    <header class="sheet-header">
      <h1 class="sheet-title">Tabla de resultados</h1>
      <div class="sheet-actions">
        <button id="btn-copy" class="btn-copy btn-icon" aria-label="Copiar tabla" title="Copiar tabla">
          <i data-lucide="copy"></i>
        </button>
        <div class="level-filter" aria-label="Filtro de nivel">
          <label for="level-select" class="level-label">Nivel</label>
          <select id="level-select" class="level-select" aria-label="Seleccionar nivel"></select>
        </div>
        <div class="unit-badge" id="unit-badge" title="Unidad de medida"></div>
      </div>
    </header>

    <section class="sheet-wrap">
      <div class="sheet-scroll">
        <div id="inputs-tables" class="inputs-stack" aria-live="polite"></div>
      </div>
      <p class="sheet-empty" id="empty-msg" hidden>No hay datos de inputs para esta sesión.</p>
    </section>

    <button id="btn-volver" class="btn-return" aria-label="Volver">
          <i data-lucide="chevron-left"></i>
      </button>
  </main>

  <script src="js/auth_guard.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{ try{ lucide.createIcons(); }catch(e){} });</script>
  <script src="js/inputs_monoanalito.js"></script>
</body>
</html>
