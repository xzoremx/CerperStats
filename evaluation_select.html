<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://unpkg.com data:; connect-src 'self';">
  <title>CerperStats – Selección de Evaluación</title>
  <link rel="stylesheet" href="css/evaluation_select.css">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
  <!-- ======== SIDEBAR ======== -->
  <aside id="sidebar">
    <ul class="menu">
      <li class="menu-item active">
        <span class="icon"><i data-feather="command"></i></span>
        <span class="label">Dashboard</span>
      </li>
      <li class="menu-item" id="menu-visualizaciones">
        <span class="icon"><i data-feather="bar-chart-2"></i></span>
        <span class="label">Visualizaciones</span>
      </li>
      <li class="menu-item">
        <span class="icon"><i data-feather="settings"></i></span>
        <span class="label">Configuración</span>
      </li>
    </ul>
  </aside>

  <!-- ======== CONTENIDO PRINCIPAL ======== -->
  <main id="main">
    <section class="dashboard-layout">
      <header class="header">
        <h1>Selecciona las evaluaciones a ejecutar</h1>
        <p>Elige una o más pruebas estadísticas que se aplicarán a tus datos.</p>
      </header>

      <div class="analysis-grid">
        <!-- Las tarjetas se insertan dinámicamente desde evaluation_select.js -->
      </div>
    </section>
  </main>

  <!-- ======== BOTONES INFERIORES ======== -->
  <button id="go-back" class="btn-back">
    <i data-feather="arrow-left"></i> Volver
  </button>

  <div class="button-group-right">
    <button id="btn-evaluar" class="primary">
      <i data-feather="activity"></i> Evaluar
    </button>
    <button id="btn-continuar" class="secondary">
      <i data-feather="file-text"></i> Continuar
    </button>
  </div>

  <!-- ======== SCRIPTS ======== -->
  <script src="js/auth_guard.js"></script>
  <script src="js/security/icon_safety.js"></script>
  <script src="renderer.js"></script>
  <script src="js/evaluation_select.js" defer></script>
  <script>
    if (window.feather) feather.replace();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
