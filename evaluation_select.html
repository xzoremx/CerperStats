<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self';">
  <title>CerperStats – Selección de Evaluación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif
    }

    /* Scrollbar styles inherited from global.css */

    /* Single-Layer Glass Effect - Optimized for Performance */
    .glass-container {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.02) 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        0 0 0 0.5px rgba(255, 255, 255, 0.05) inset,
        0 20px 60px -10px rgba(0, 0, 0, 0.6);
      position: relative;
      /* GPU optimizations */
      will-change: transform;
      transform: translateZ(0);
      contain: layout style paint;
    }

    .glass-sidebar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border-right: 0.5px solid rgba(255, 255, 255, 0.1);
      contain: layout style;
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      /* GPU optimizations */
      will-change: transform, opacity;
      transform: translateZ(0);
      contain: layout style paint;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.06) 100%);
    }

    .glass-card.selected {
      border-color: rgba(52, 211, 153, 0.6);
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.15) 0%, rgba(16, 185, 129, 0.08) 100%);
      box-shadow:
        0 0 0 1px rgba(52, 211, 153, 0.3) inset,
        0 8px 16px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(52, 211, 153, 0.1);
    }

    .glass-card.blocked {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .glass-card.blocked:hover {
      border-color: rgba(239, 68, 68, 0.4);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);
    }

    .icon-container {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      transform: translateZ(0);
    }

    .icon-container:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.12) 100%);
    }





    /* Notification styles */
    .notify {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0;
      transition: all 0.35s ease;
      z-index: 9999;
      pointer-events: none;
    }

    .notify.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .notify.success {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.2) 0%, rgba(16, 185, 129, 0.15) 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #6ee7b7;
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.15);
    }

    .notify.error {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.15) 100%);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
    }

    .notify.warning {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(245, 158, 11, 0.15) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fcd34d;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.15);
    }

    .notify.info {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.15) 100%);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
    }

    /* Button styles - Minimalist */
    .btn-glass {
      transition: all 0.25s ease;
      transform: translateZ(0);
      will-change: transform;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-glass:hover {
      transform: translateY(-2px);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-glass:active {
      transform: translateY(0);
    }

    .btn-glass:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body
  class="min-h-screen bg-gradient-to-br from-gray-900 via-slate-900 to-gray-800 text-white relative overflow-x-hidden">

  <!-- Video Background -->
  <div class="fixed inset-0 -z-20">
    <div class="w-full h-full">
      <video autoplay loop muted playsinline class="w-full h-full object-cover">
        <source src="assets/videos/evaluation_select.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- Main Application Window -->
  <div class="flex-1 flex px-4 sm:px-6 pb-16 pt-12 items-start justify-center relative">
    <div class="relative w-full max-w-7xl mt-8 glass-container rounded-3xl flex flex-col overflow-hidden shadow-2xl">

      <!-- Main Workspace Content -->
      <div class="flex flex-1 min-h-0 relative">
        <!-- Enhanced Sidebar -->
        <div class="glass-sidebar w-80 lg:w-96 flex flex-col relative z-10">

          <!-- Enhanced Navigation -->
          <div class="flex-1 p-4 space-y-3 overflow-y-auto">
            <div class="mb-8">
              <h3 class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-4 px-3">Dashboard</h3>
              <nav class="space-y-1.5">
                <a href="#"
                  class="flex items-center gap-4 px-4 py-3 rounded-xl bg-blue-500/15 border border-blue-500/20 text-blue-200 transition-all duration-200 hover:bg-blue-500/25 group">
                  <i data-lucide="home" class="w-5 h-5"></i>
                  <span class="font-medium">Evaluaciones</span>
                  <div class="ml-auto w-2 h-2 rounded-full bg-blue-400"></div>
                </a>

                <a href="#" id="menu-visualizaciones"
                  class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/8 transition-all duration-200 group">
                  <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                  <span class="font-medium">Visualizaciones</span>
                </a>

                <a href="#"
                  class="flex items-center gap-4 px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/8 transition-all duration-200 group">
                  <i data-lucide="settings" class="w-5 h-5"></i>
                  <span class="font-medium">Configuración</span>
                </a>
              </nav>
            </div>
          </div>

          <!-- Back Button - Fixed at bottom -->
          <div class="p-4 border-t border-white/10">
            <button id="go-back"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/8 transition-all duration-200 w-full">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
              <span class="font-medium">Volver</span>
            </button>
          </div>
        </div>

        <!-- Main Content Area with Liquid Glass Effect -->
        <div id="main-content-panel" class="flex-1 flex flex-col min-h-0 relative"
          style="border-left: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0 28px 28px 0; background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);">
          <!-- Content Header -->
          <div class="p-8 border-b border-white/5">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              <div>
                <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">Hola de nuevo</h2>
                <p class="text-gray-200 text-lg">Elige una o más pruebas estadísticas que se aplicarán en tu sesión</p>
              </div>
              <div class="flex items-center gap-4">
                <button id="btn-evaluar" class="btn-glass px-6 py-2.5 rounded-lg font-medium flex items-center gap-2"
                  style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: #6ee7b7; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                  <i data-lucide="play" class="w-4 h-4"></i>
                  Evaluar
                </button>
                <button id="btn-continuar" class="btn-glass px-6 py-2.5 rounded-lg font-medium flex items-center gap-2"
                  style="background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); color: #93c5fd; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                  Continuar
                </button>
              </div>
            </div>
          </div>

          <!-- Dashboard Content -->
          <div class="flex-1 p-8 overflow-y-auto">
            <!-- Progress Card -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
              <div class="glass-card p-6 rounded-xl group cursor-pointer col-span-full" id="progress-card">
                <div class="flex items-center justify-between mb-4">
                  <div class="flex items-center gap-4">
                    <div
                      class="w-12 h-12 rounded-lg bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center">
                      <i data-lucide="clipboard-check" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                      <h4 class="text-lg font-semibold text-white group-hover:text-orange-300 transition-colors">
                        Progreso de Evaluación</h4>
                    </div>
                  </div>
                  <div class="text-right">
                    <span id="progress-status"
                      class="text-xs bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded-full font-medium">Pendiente</span>
                  </div>
                </div>
                <div class="flex items-center justify-between">
                  <div class="w-full bg-gray-700/50 rounded-full h-2 mr-4">
                    <div id="progress-bar"
                      class="bg-gradient-to-r from-orange-500 to-red-600 h-2 rounded-full transition-all duration-500"
                      style="width: 0%"></div>
                  </div>
                  <span id="progress-percent" class="text-sm text-gray-400 whitespace-nowrap">0%</span>
                </div>
              </div>
            </div>

            <!-- Evaluations Grid - Dynamically populated -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 analysis-grid">
              <!-- Cards are inserted dynamically from evaluation_select.js -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



  <!-- Scripts -->
  <script src="js/auth_guard.js"></script>
  <script src="js/security/icon_safety.js"></script>
  <script src="js/liquid_glass.js"></script>
  <script src="js/evaluation_select.js" defer></script>
  <script>
    // Initialize Lucide icons
    if (window.lucide) lucide.createIcons();

    // Initialize Liquid Glass effect on main content panel
    document.addEventListener('DOMContentLoaded', function () {
      const mainPanel = document.getElementById('main-content-panel');
      if (mainPanel && window.LiquidGlass) {
        LiquidGlass.apply(mainPanel, {
          cornerRadius: 28,
          displacementScale: 120,
          aberrationIntensity: 2,
          saturation: 140,
          blurAmount: 0, // blur en px (ej: 8)
          elasticity: 0.15,
          centerDistortion: 1,
          // modes: 'standard' | 'polar' | 'prominent' | 'shader' (aliases: 'edge', 'edges')
          mode: 'standard'
        });
      }
    });
  </script>
</body>

</html>
