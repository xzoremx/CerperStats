<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | CerperStats</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/global.css" />
</head>
<body>
  <div class="wrapper">
    <div class="logo-container">
      <img src="assets/logos/logo.png" alt="CERPER" class="cerper-logo" />
    </div>

    <form id="login-form">
      <h2>Iniciar Sesión</h2>

      <div class="input-field">
        <input type="text" id="username" required autocomplete="off" />
        <label>Usuario</label>
      </div>

      <div class="input-field">
        <input type="password" id="password" required />
        <label>Contraseña</label>
      </div>

      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember" />
          <p>Recordarme</p>
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" id="btn-login">Iniciar sesión</button>

      <p id="msg" style="margin-top: 12px; font-size: 0.9rem;"></p>

      <div class="register">
        <p>¿No tienes cuenta? <a href="#">Contacta al administrador</a></p>
      </div>
    </form>
  </div>

  <script src="js/login.js"></script>
  <div class="watermark-glass">Zorem Production</div>
</body>
</html>
