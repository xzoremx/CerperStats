services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cerperstats
      POSTGRES_USER: cerper_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - cerper_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CERPER_PROXY_PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: cerperstats
      PGUSER: cerper_user
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CERPER_PG_SSL: "false"
      CERPER_EVAL_CONCURRENCY_MULTI: ${CERPER_EVAL_CONCURRENCY_MULTI:-1}
    ports:
      - "4000:4000"
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped

volumes:
  cerper_pgdata:
