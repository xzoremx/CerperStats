<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Summersmuir</title>
  <meta name="description" content="A beautiful blog with 3D card stack and timeline navigation">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <nav class="nav">
      <a href="#" class="logo">summersmuir</a>
      <div class="nav-links">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link active">Blog</a>
        <a href="#" class="nav-link">PRs</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- View Toggle -->
    <div class="view-toggle-container">
      <div class="view-toggle">
        <button id="btn-rolodex" class="view-btn active" aria-label="Rolodex view">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </button>
        <button id="btn-list" class="view-btn" aria-label="List view">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Rolodex View -->
    <section id="rolodex-view" class="rolodex-view">
      <div class="perspective-container">
        <div id="cards-container" class="cards-container">
          <!-- Cards will be injected by JS -->
        </div>
      </div>
      
      <!-- Timeline -->
      <div id="timeline" class="timeline">
        <div class="timeline-label timeline-label-top">Dec '24</div>
        <div id="timeline-track" class="timeline-track">
          <!-- Ticks and markers will be injected by JS -->
        </div>
        <div class="timeline-label timeline-label-bottom">Now</div>
      </div>
      
      <div class="scroll-hint">Scroll or drag timeline</div>
    </section>

    <!-- List View -->
    <section id="list-view" class="list-view hidden">
      <div id="list-container" class="list-container">
        <!-- List items will be injected by JS -->
      </div>
      <!-- Floating image preview -->
      <div id="hover-preview" class="hover-preview">
        <img id="hover-image" src="" alt="">
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
