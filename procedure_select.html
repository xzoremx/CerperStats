<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://unpkg.com data:; connect-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedimiento - CerperStats</title>
    <link rel="stylesheet" href="css/procedure_select.css">
  </head>
  <body>
    <div class="about-logo" role="img" aria-label="CERPER"></div>
    <div class="obfuscated">Procedimientos</div>
    <main class="menu" aria-label="Menú de selección">
      <a class="gradient-border card" data-proc="Autorizaciones"><span>Autorizaciones</span></a>
      <a class="gradient-border card" data-proc="Implementaciones"><span>Implementaciones</span></a>
      <a class="gradient-border card" data-proc="Intralaboratorios"><span>Intralaboratorios</span></a>
      <a class="gradient-border card" data-proc="Intercomparación"><span>Intercomparación</span></a>
    </main>

    <button id="go-menu" class="btn-back">
      <i data-lucide="arrow-left"></i> Ir al menú
    </button>
    <button id="go-sessions" class="btn-sessions">
      <i data-lucide="list"></i> Sesiones
    </button>

    <script src="js/auth_guard.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/procedure_select.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
      });
    </script>
  </body>

</html>
