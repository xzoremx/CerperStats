<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://unpkg.com https://fonts.gstatic.com data:; connect-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedimiento - CerperStats</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/procedure_select.css" />
    <!-- Estilos mínimos inline para que el loader aparezca de inmediato antes de que cargue el JS -->
    <style>
      #procedure-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(5, 5, 7, 0.94);
        z-index: 5000;
        opacity: 1;
      }
      #procedure-loader .loader-box {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: rgba(15, 15, 17, 0.9);
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e5e7eb;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #procedure-loader .dots {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      #procedure-loader .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22d3ee;
        opacity: 0.6;
        animation: inline-proc-dot 0.9s infinite ease-in-out;
      }
      #procedure-loader .dots span:nth-child(2) { animation-delay: 0.15s; }
      #procedure-loader .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes inline-proc-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="procedure-loader" class="visible">
      <div class="loader-box">
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="loader-text" style="margin:0;">Preparando procedimientos...</p>
      </div>
    </div>
  <div id="vanta-bg" aria-hidden="true"></div>
  <svg class="hidden-svg" aria-hidden="true">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="15"></feGaussianBlur>
        </filter>
      </defs>
    </svg>

    <main class="app menu" aria-label="Menu de seleccion de procedimientos">
      <div class="card-shell">
        <div class="glow-bg"></div>

        <div class="card-container">
          <header class="card-header">
            <div class="card-hero" id="procedure-hero" aria-hidden="true">
              <div class="card-hero-overlay" aria-hidden="true">
                <h2 class="card-hero-title" id="hero-lab-title">Laboratorio</h2>
                <div class="hero-divider"></div>
                <p id="lab-info" class="hero-subtitle">Seleccione el procedimiento para esta sesion.</p>
              </div>
            </div>
          </header>

          <section class="cards-grid" id="cards-grid">
          </section>
        </div>
      </div>
    </main>

    <button id="go-menu" class="btn-back ring-btn" aria-label="Volver al menu">
      <span class="ring-spin" aria-hidden="true"></span>
      <span class="btn-content">Ir al menu</span>
    </button>
    <button id="go-sessions" class="btn-sessions ring-btn" aria-label="Sesiones">
      <span class="ring-spin" aria-hidden="true"></span>
      <span class="btn-content">Sesiones</span>
    </button>

  <script src="js/procedure_loader.js"></script>
  <script src="js/auth_guard.js"></script>
  <script src="js/procedure_select_vanta.js" defer></script>
  <script type="module" src="js/procedure_select.js"></script>
  <script id="lucide-cdn" src="https://unpkg.com/lucide@latest" async crossorigin="anonymous"></script>
</body>
</html>
